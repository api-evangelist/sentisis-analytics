aid: sentisis-analytics
name: Sentisis Analytics
description: >-
  Sentisis (Sentisis Intelligence) is a Spanish-language AI consumer-intelligence
  and sentiment-analysis platform that turns social media conversations, surveys,
  emails, and online reviews into actionable business insight using proprietary
  natural-language-processing built for Spanish and its regional variants. Products
  span Social Media listening, Customer Experience analytics, Reviews analysis, and
  sector consulting, serving brands such as Vodafone, Santander, Bancolombia, ALDI,
  Iberdrola, and Sony Pictures from offices in Madrid, Bogota, and Mexico City. The
  company was surfaced as a 500 Global portfolio company and added to the API
  Evangelist network. No public developer API, OpenAPI, or documentation surface was
  found during enrichment; this profile captures the company identity and a domain
  security probe.
